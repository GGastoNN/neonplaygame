name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      GODOT_VERSION: "4.3-stable"
      GODOT_EDITOR_VERSION: "4.3.stable"
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android requeridos
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platforms;android-36"

      - name: Crear debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          rm -f "$KEYSTORE_PATH"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
            -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Neon Apex,C=AR"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          test -f "$KEYSTORE_PATH"

      - name: Descargar Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.3-stable_linux.x86_64.zip" \
            -O "$RUNNER_TEMP/godot.zip"

          unzip -q "$RUNNER_TEMP/godot.zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v4.3-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          "$GODOT_DIR/godot" --version

      - name: Instalar plantillas de exportación Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_EDITOR_VERSION}"
          mkdir -p "$TEMPLATE_DIR"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.3-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/godot_templates.tpz"

          unzip -q -j "$RUNNER_TEMP/godot_templates.tpz" -d "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_source.zip"

      - name: Instalar Android Gradle Build Template
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --install-android-build-template
          test -f android/build/build.gradle

      - name: Instalar Google Play Billing oficial
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/billing-plugin" addons/GodotGooglePlayBilling
          mkdir -p "$RUNNER_TEMP/billing-plugin" addons
          wget -q --show-progress \
            "https://github.com/godot-sdk-integrations/godot-google-play-billing/releases/download/3.3.0/godot-google-play-billing.zip" \
            -O "$RUNNER_TEMP/godot-google-play-billing.zip"
          unzip -q "$RUNNER_TEMP/godot-google-play-billing.zip" -d "$RUNNER_TEMP/billing-plugin"
          PLUGIN_CFG="$(find "$RUNNER_TEMP/billing-plugin" -type f -name plugin.cfg -path '*GodotGooglePlayBilling*' -print -quit)"
          test -n "$PLUGIN_CFG"
          PLUGIN_DIR="$(dirname "$PLUGIN_CFG")"
          cp -a "$PLUGIN_DIR" addons/GodotGooglePlayBilling
          test -f addons/GodotGooglePlayBilling/plugin.cfg
          find addons/GodotGooglePlayBilling -maxdepth 4 -type f -print

      - name: Configurar rutas Android para Godot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          export/android/debug_keystore_user = "$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          export/android/debug_keystore_pass = "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          EOF

          cp "$HOME/.config/godot/editor_settings-4.tres" \
             "$HOME/.config/godot/editor_settings-4.3.tres"

          echo "Godot: $(godot --version)"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "KEYSTORE=$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

          java -version
          adb --version
          sdkmanager --version

          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

      - name: Validar proyecto e importar recursos
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f scripts/car.gd
          test -f scripts/mobile_controls.gd
          test -f scripts/hud_overlay.gd
          test -f scripts/traffic_car.gd
          test -f scripts/billing_manager.gd
          test -f scripts/garage_menu.gd
          test -f addons/GodotGooglePlayBilling/plugin.cfg
          test -f android/build/build.gradle
          grep -q '^textures/vram_compression/import_etc2_astc=true$' project.godot
          grep -q '^window/handheld/orientation=4$' project.godot
          grep -q '^window/stretch/aspect="expand"$' project.godot

          godot --headless --editor --path . --quit

      - name: Smoke test de arranque de la escena
        shell: bash
        run: |
          set -euo pipefail
          set +e
          godot --headless --verbose --path . --quit-after 240 2>&1 | tee runtime-smoke.log
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e

          if grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid call|Invalid assignment|Invalid get index|Invalid set index' runtime-smoke.log; then
            echo "Se detectó un error de ejecución en la escena principal."
            cat runtime-smoke.log
            exit 1
          fi

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Godot terminó con código $GODOT_EXIT durante el smoke test."
            cat runtime-smoke.log
            exit "$GODOT_EXIT"
          fi

      - name: Exportar APK DEBUG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            "build/NeonApex-PRO-V8-GARAGE-debug.apk"

          test -s build/NeonApex-PRO-V8-GARAGE-debug.apk
          ls -lh build/NeonApex-PRO-V8-GARAGE-debug.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: NeonApex-PRO-V8-GARAGE-Android-Debug
          path: build/NeonApex-PRO-V8-GARAGE-debug.apk
          if-no-files-found: error
          retention-days: 30
